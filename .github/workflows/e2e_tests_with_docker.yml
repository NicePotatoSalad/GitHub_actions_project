name: Pipeline E2E tests with Docker

on:
  push:
    branches:
      - docker_implem
  pull_request:
    branches:
      - docker_implem

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build application 
        run: echo "Simulating application build..." && mkdir -p build && echo "App version 1.0.0" > build/my_app_info.txt
      - name: Upload application build artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-build
          path: build/

  run_e2e_tests:
    runs-on: ubuntu-latest
    needs: build
    services:
      selenium-hub:
        image: selenium/hub:latest
        ports: 
          - 4444:4444

      selenium-node-chrome:
        image: selenium/node-chrome:latest
        env:
          SE_EVENT_BUS_HOST: selenium-hub
          SE_EVENT_BUS_PUBLISH_PORT: 4442
          SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
        

      selenium-node-firefox:
        image: selenium/node-firefox:latest
        env:
          SE_EVENT_BUS_HOST: selenium-hub
          SE_EVENT_BUS_PUBLISH_PORT: 4442
          SE_EVENT_BUS_SUBSCRIBE_PORT: 4443

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: 3.13


      # - name: Download application build artifact
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: application-buildb
      #     path: build/
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run E2E Tests
        run: |
          export PYTHONPATH=$PYTHONPATH:. 
          mkdir -p reports/
          pytest tests/ui -s -v -n auto --junitxml=reports/e2e_tests_results.xml --browser chrome
        env:
          SELENIUM_GRID_URL: http://selenium-hub:4444
      
      # - name: Upload E2E Test Reports
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: e2e_tests_report
      #     path: reports/
      #     if-no-files-found: ignore

      
  
    